# Network binding for the FastAPI service itself.
server:
  address: "0.0.0.0"
  port: 8080

# Root directory where checked-out repositories are stored locally.
workspace_root: "./workspace"

# Build knowledge base configuration for intelligent build orchestration.
# When enabled, BuildClaw will auto-detect project types, use build recipes,
# learn from build outcomes, and apply workarounds automatically.
knowledge:
  enabled: false
  knowledge_root: "./knowledge"
  auto_detect: true
  auto_learn: true
  apply_workarounds: true
  max_retry_with_workaround: 2

# Repository-level deployment configuration.
repositories:
  - id: "my-project"
    name: "My Project"
    git_url: "https://github.com/example/repo.git"
    webhook_secret: "replace-me"
    auth:
      https_username: "git"
      https_token: ""
      ssh_private_key_base64: ""
    branches:
      # Example: smart_build with auto-detection for main branch
      - pattern: "main"
        steps:
          - name: "smart-build"
            plugin: "smart_build"
            config:
              phases: ["install", "test", "build", "deploy"]
              skip_tests: false
              apply_workarounds: true
              max_retry_with_workaround: 2

      # Example: traditional command_deploy for feature branches
      - pattern: "feature/*"
        steps:
          - name: "run-tests"
            plugin: "command_deploy"
            config:
              command: ["npm", "test"]
              timeout_sec: 300
