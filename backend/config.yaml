# Network binding for the FastAPI service itself.
server:
  address: "0.0.0.0"
  port: 8080

# Root directory where checked-out repositories are stored locally.
workspace_root: "./workspace"

# Build knowledge base configuration for intelligent build orchestration.
knowledge:
  enabled: true
  knowledge_root: "./knowledge"
  auto_detect: true
  auto_learn: true
  apply_workarounds: true
  max_retry_with_workaround: 2

# Repository-level deployment configuration.
repositories:
  - id: "buildclaw"
    name: "buildclaw"
    git_url: "https://github.com/rockmelodies/buildclaw.git"
    webhook_secret: "replace-me"
    auth:
      # Use HTTPS token authentication when SSH is not configured.
      https_username: "git"
      https_token: ""
      # Optional base64-encoded private key for SSH-based cloning.
      ssh_private_key_base64: ""
    branches:
      # Exact branch rule — using smart_build for intelligent auto-detection.
      - pattern: "main"
        steps:
          - name: "smart-build-main"
            plugin: "smart_build"
            config:
              phases: ["install", "build"]
              skip_tests: false
              apply_workarounds: true
      # Prefix wildcard rule — using traditional command_deploy.
      - pattern: "feature/*"
        steps:
          - name: "preview-check"
            plugin: "command_deploy"
            config:
              command: ["go", "test", "./..."]
              working_dir: "backend"
              timeout_sec: 300
